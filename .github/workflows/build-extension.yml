name: Build extension

on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch, tag, or commit to build'
                required: false
                default: 'main'
                type: string

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - run: pnpm install --filter @project/extension --filter @project/common --filter @project/client
            - run: pnpm --filter @project/extension run zip
            - run: pnpm --filter @project/extension run zip:firefox
            - run: pnpm --filter @project/extension run zip:firefox-android

            - name: Upload extension ZIPs
              uses: actions/upload-artifact@v4
              with:
                  name: asbplayer-extensions
                  path: |
                      extension/.output/*-chrome.zip
                      extension/.output/*-firefox.zip
                      extension/.output/*-firefox-android.zip
                  if-no-files-found: error
