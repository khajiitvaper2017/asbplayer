name: Build extension

on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch, tag, or commit to build'
                required: false
                default: 'main'
                type: string

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - run: pnpm install --filter @project/extension --filter @project/common --filter @project/client
            - run: pnpm --filter @project/extension run zip
            - run: pnpm --filter @project/extension run zip:firefox
            - run: pnpm --filter @project/extension run zip:firefox-android

            - name: Read extension version
              id: version
              run: |
                  set -euo pipefail
                  version=$(node -e "const fs=require('fs');const m=fs.readFileSync('extension/wxt.config.ts','utf8').match(/const version = '([^']+)'/);if(!m){console.error('version not found in extension/wxt.config.ts');process.exit(1)}console.log(m[1])")
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Upload extension ZIPs
              uses: actions/upload-artifact@v4
              with:
                  name: asbplayer-jiten-extensions
                  path: |
                      extension/.output/*-chrome.zip
                      extension/.output/*-firefox.zip
                      extension/.output/*-firefox-android.zip
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  gh release create "v${VERSION}" \
                    --target "${GITHUB_SHA}" \
                    --title "asbplayer v${VERSION}" \
                    --generate-notes \
                    extension/.output/asbplayer-${VERSION}-chrome.zip \
                    extension/.output/asbplayer-${VERSION}-firefox.zip \
                    extension/.output/asbplayer-${VERSION}-firefox-android.zip
